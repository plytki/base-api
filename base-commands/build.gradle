plugins {
    id 'java'
}

group = 'dev.plytki'
version = '2.0.1-SNAPSHOT'

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = 'base-commands'
            version = version
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/plytki/base-api"
            credentials {
                username = System.getenv("USERNAME")
                password = System.getenv("TOKEN")
            }
        }
    }
}

repositories {
    mavenCentral()
}