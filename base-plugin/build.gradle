plugins {
    id 'java'
}

group = 'dev.plytki'
version = '2.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(path: ':base-commands')
    implementation project(path: ':base-inventories')

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}